name: CI
on:
  - push
  - pull_request

concurrency:
  # If changes are pushed to a PR, stop all running workflows before starting new ones
  group: ${{ github.head_ref || (github.repository == 'saltstack/salt-bootstrap' && github.run_id || github.ref_name) }}
  cancel-in-progress: true

jobs:

  collect-changed-files:
    name: Collect changed files
    runs-on: ubuntu-latest
    outputs:
      run-tests: ${{ steps.set-output.outputs.run-tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get specific changed files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          separator: ","
          files: |
            bootstrap-salt.*
            tests/**
            .github/workflows/**
          files_ignore: |
            .github/workflows/release.yml

      - name: Set Job Output
        id: set-output
        run: |
          echo "run-tests=${{ steps.changed-files.outputs.any_modified }}" >> $GITHUB_OUTPUT

      - name: Set Exit Status
        if: always()
        run: |
          mkdir exitstatus
          echo "${{ job.status }}" > exitstatus/${{ github.job }}

      - name: Upload Exit Status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exitstatus-${{ github.job }}
          path: exitstatus/

  generate-actions-workflow:
    name: Generate The Actions Workflow
    runs-on: ubuntu-latest
    needs: collect-changed-files

    if: github.event_name == 'push' || needs.collect-changed-files.outputs.run-tests == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Pre-Commit
        run: |
          python3 -m pip install -U pip
          python3 -m pip install pre-commit
          pre-commit install --install-hooks

      - name: Generate Workflow Actions
        run: |
          pre-commit run -av generate-actions-workflow

      - name: Set Exit Status
        if: always()
        run: |
          mkdir exitstatus
          echo "${{ job.status }}" > exitstatus/${{ github.job }}

      - name: Upload Exit Status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exitstatus-${{ github.job }}
          path: exitstatus/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: collect-changed-files
    container: koalaman/shellcheck-alpine:latest
    if: github.event_name == 'push' || needs.collect-changed-files.outputs.run-tests == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: |
          shellcheck -s sh -f tty bootstrap-salt.sh

      - name: Set Exit Status
        if: always()
        run: |
          mkdir exitstatus
          echo "${{ job.status }}" > exitstatus/${{ github.job }}

      - name: Upload Exit Status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exitstatus-${{ github.job }}
          path: exitstatus/

  lint-powershell:
    name: Lint PowerShell
    runs-on: ubuntu-latest
    needs: collect-changed-files
    if: github.event_name == 'push' || needs.collect-changed-files.outputs.run-tests == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          # The runner image normally ships it; only install if it is missing
          if (-not (Get-Module PSScriptAnalyzer -ListAvailable)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          # Write-Host is intentional (interactive installer output), and
          # Get-FileHash is overridden on purpose to support PowerShell 3. The
          # script parameters all take pipeline input, and singular function
          # names are only a style preference, so those rules are skipped too.
          $results = Invoke-ScriptAnalyzer -Path ./bootstrap-salt.ps1 `
            -Severity Error,Warning `
            -ExcludeRule PSAvoidUsingWriteHost,PSAvoidOverwritingBuiltInCmdlets,PSUseProcessBlockForPipelineCommand,PSUseSingularNouns
          $results | Format-List RuleName, Severity, Line, Message
          # A clean run prints nothing above, so say what was checked
          $version = (Get-Module PSScriptAnalyzer -ListAvailable | Select-Object -First 1).Version
          Write-Host "PSScriptAnalyzer $version checked bootstrap-salt.ps1: $(@($results).Count) findings"
          if ($results) { exit 1 }

      - name: Set Exit Status
        if: always()
        run: |
          mkdir exitstatus
          echo "${{ job.status }}" > exitstatus/${{ github.job }}

      - name: Upload Exit Status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exitstatus-${{ github.job }}
          path: exitstatus/

  test-shell:
    name: Test Shell
    runs-on: ubuntu-latest
    needs: collect-changed-files
    if: github.event_name == 'push' || needs.collect-changed-files.outputs.run-tests == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellSpec
        run: |
          git clone --depth 1 --branch 0.28.1 https://github.com/shellspec/shellspec.git "$RUNNER_TEMP/shellspec"

      # bootstrap-salt.sh is POSIX sh and Debian/Ubuntu run it under dash, so
      # run the specs under dash as well as bash
      - name: ShellSpec (dash)
        run: |
          "$RUNNER_TEMP/shellspec/shellspec" --shell dash

      - name: ShellSpec (bash)
        run: |
          "$RUNNER_TEMP/shellspec/shellspec" --shell bash

      - name: Set Exit Status
        if: always()
        run: |
          mkdir exitstatus
          echo "${{ job.status }}" > exitstatus/${{ github.job }}

      - name: Upload Exit Status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exitstatus-${{ github.job }}
          path: exitstatus/

  test-powershell:
    name: Test PowerShell
    # Windows PowerShell 5.1 is what bootstrap-salt.ps1 mostly runs on
    runs-on: windows-latest
    needs: collect-changed-files
    if: github.event_name == 'push' || needs.collect-changed-files.outputs.run-tests == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Pester
        shell: powershell
        run: |
          # The image ships Pester 3; the tests need 5
          Install-Module Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -MinimumVersion 5.0.0
          $config = New-PesterConfiguration
          $config.Run.Path = "tests/powershell"
          $config.Run.Exit = $true
          $config.Output.Verbosity = "Detailed"
          Invoke-Pester -Configuration $config

      - name: Set Exit Status
        if: always()
        run: |
          mkdir exitstatus
          echo "${{ job.status }}" > exitstatus/${{ github.job }}

      - name: Upload Exit Status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exitstatus-${{ github.job }}
          path: exitstatus/



