name: Test Windows
on:
  workflow_call:
    inputs:
      distro-slug:
        type: string
        required: true
        description: The Distribution Slug

      display-name:
        type: string
        required: true
        description: The Display Name For The Job

      runs-on:
        type: string
        required: true
        description: The GitHub Windows Worker To Run Workflow On

      instances:
        type: string
        required: true
        description: The Instances To Test

      container-slug:
        type: string
        required: true
        description: The Container Slug

      timeout:
        type: number
        required: false
        default: 20
        description: The timeout(in minutes) for the workflow

jobs:
  Test:
    name: ${{ matrix.instance }}
    runs-on: windows-latest
    timeout-minutes: ${{ inputs.timeout }}
    strategy:
      fail-fast: false
      matrix:
        instance: ${{ fromJSON(inputs.instances) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python Dependencies
        run: |
          python3 -m pip install -r tests/requirements.txt

      - name: Get Version
        run: |
          # We need to get the version here and make it an environment variable
          # It is used to install via bootstrap and in the test
          # The version is in the instance name:
          # ["stable-3006", "stable-3006-24", "stable-3007", "stable-3007-1", "latest"]
          $instance = "${{ matrix.instance }}"
          $version = $instance -split "-",2
          if ( $version.Count -gt 1 ) {
            $version = $version[1].Replace("-", ".")
          }
          Write-Output "SaltVersion=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Bootstrap Salt
        run: |
          . .\bootstrap-salt.ps1 -RunService $false -Version $env:SaltVersion

      - name: Test Bootstrap
        run: |
          pytest --cache-clear -v -s -ra --log-cli-level=debug tests/integration/

      - name: Test -ConfigureOnly
        # Regression test for #2138. Runs after "Test Bootstrap" since it
        # overwrites the minion config.
        run: |
          $ErrorActionPreference = "Stop"
          $rootDir = "$env:ProgramData\Salt Project\Salt"
          $regKey = "HKLM:\SOFTWARE\Salt Project\Salt"
          if ( Test-Path $regKey ) {
            $reg = (Get-ItemProperty $regKey).root_dir
            if ( $reg ) { $rootDir = $reg }
          }
          $confDir = "$rootDir\conf"

          # Nothing to copy: must warn and exit 0 rather than throw
          Remove-Item C:\tmp -Recurse -Force -ErrorAction SilentlyContinue
          & .\bootstrap-salt.ps1 -ConfigureOnly
          if ( $LASTEXITCODE -ne 0 ) { throw "-ConfigureOnly with nothing to copy exited $LASTEXITCODE" }

          # Files in C:\tmp must land under the Salt root dir
          New-Item C:\tmp -ItemType Directory -Force | Out-Null
          Set-Content -Path C:\tmp\minion -Value "id: configure-only-test"
          Set-Content -Path C:\tmp\grains -Value "role: configure-only-test"
          Set-Content -Path C:\tmp\minion.pem -Value "fake-private-key"
          Set-Content -Path C:\tmp\minion.pub -Value "fake-public-key"
          & .\bootstrap-salt.ps1 -ConfigureOnly
          if ( $LASTEXITCODE -ne 0 ) { throw "-ConfigureOnly exited $LASTEXITCODE" }

          $expected = @{
            "$confDir\minion"               = "id: configure-only-test"
            "$confDir\grains"               = "role: configure-only-test"
            "$confDir\pki\minion\minion.pem" = "fake-private-key"
            "$confDir\pki\minion\minion.pub" = "fake-public-key"
          }
          foreach ( $path in $expected.Keys ) {
            if ( !(Test-Path $path) ) { throw "Missing $path" }
            $content = (Get-Content $path -Raw).Trim()
            if ( $content -ne $expected[$path] ) { throw "Unexpected content in ${path}: $content" }
          }
          # And not on the drive root, where the broken paths used to send them
          if ( Test-Path C:\conf ) { throw "Files were copied to C:\conf" }

      - name: Test -RepoUrl
        # Uses a fake repo, served over HTTP.
        run: |
          $ErrorActionPreference = "Stop"
          $repo = Join-Path $env:RUNNER_TEMP "repo"
          # whoami.exe stands in for the installer: it exits immediately, and
          # the salt-minion service already exists from the earlier bootstrap
          foreach ( $v in "3007.5", "3008.1", "3008.2", "3009.0rc1" ) {
            New-Item "$repo\$v" -ItemType Directory -Force | Out-Null
            Copy-Item "$env:SystemRoot\System32\whoami.exe" "$repo\$v\Salt-Minion-$v-Py3-AMD64-Setup.exe"
          }
          $server = Start-Process python -ArgumentList "-m", "http.server", "8765", "--directory", $repo `
            -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 3
            $url = "http://localhost:8765/"

            function Invoke-Bootstrap($version) {
              # Write-Host goes to the information stream
              $out = & .\bootstrap-salt.ps1 -RepoUrl $url -Version $version -RunService $false 6>&1 | Out-String
              Write-Host $out
              return @{ Code = $LASTEXITCODE; Output = $out }
            }

            # "latest" is the newest GA release; the rc must be ignored
            $r = Invoke-Bootstrap "latest"
            if ( $r.Code -ne 0 -or $r.Output -notmatch "version: 3008\.2\b" ) { throw "latest did not resolve to 3008.2" }
            if ( $r.Output -notmatch [regex]::Escape("file url : ${url}3008.2/Salt-Minion-3008.2-Py3-AMD64-Setup.exe") ) { throw "Installer was not downloaded from RepoUrl" }

            # A major version selects the newest GA in that series
            $r = Invoke-Bootstrap "3007"
            if ( $r.Code -ne 0 -or $r.Output -notmatch "version: 3007\.5\b" ) { throw "3007 did not resolve to 3007.5" }

            # A prerelease can be installed by its exact name
            $r = Invoke-Bootstrap "3009.0rc1"
            if ( $r.Code -ne 0 -or $r.Output -notmatch "version: 3009\.0rc1" ) { throw "3009.0rc1 was not installable by exact name" }

            # A version that is not in the repo must fail
            $r = Invoke-Bootstrap "3010"
            if ( $r.Code -eq 0 ) { throw "3010 should not be available" }
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Set Exit Status
        if: always()
        run: |
          mkdir exitstatus
          echo "${{ job.status }}" > exitstatus/${{ github.job }}-${{ matrix.instance }}-${{ inputs.distro-slug }}

      - name: Upload Exit Status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exitstatus-${{ github.job }}-${{ matrix.instance }}-${{ inputs.distro-slug }}
          path: exitstatus/
